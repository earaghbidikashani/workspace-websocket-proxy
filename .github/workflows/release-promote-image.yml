name: "Release: Promote Image"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      short_sha:
        required: true
        type: string

env:
  STAGING_REGISTRY: ghcr.io/jupyter-infra/staging
  PROD_REGISTRY: ghcr.io/jupyter-infra
  IMAGE_NAME: workspace-websocket-proxy
  SSH_IMAGE_NAME: remote-access-server

jobs:
  promote:
    name: Promote image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Copy from staging to production
        env:
          VERSION: ${{ inputs.version }}
          SHORT_SHA: ${{ inputs.short_sha }}
        run: |
          for image in "${{ env.IMAGE_NAME }}" "${{ env.SSH_IMAGE_NAME }}"; do
            crane copy \
              "${{ env.STAGING_REGISTRY }}/$image:$VERSION" \
              "${{ env.PROD_REGISTRY }}/$image:$VERSION"
            crane copy \
              "${{ env.STAGING_REGISTRY }}/$image:sha-$SHORT_SHA" \
              "${{ env.PROD_REGISTRY }}/$image:sha-$SHORT_SHA"
          done

      - name: Point latest at the release
        if: ${{ !contains(inputs.version, '-') }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for image in "${{ env.IMAGE_NAME }}" "${{ env.SSH_IMAGE_NAME }}"; do
            crane copy \
              "${{ env.STAGING_REGISTRY }}/$image:$VERSION" \
              "${{ env.PROD_REGISTRY }}/$image:latest"
          done
